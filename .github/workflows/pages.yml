name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install browser test tools outside the checkout
        run: |
          python3 -m pip install -r scripts/requirements.txt
          npm install --prefix "$RUNNER_TEMP/shastho-tests" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/shastho-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify application and map interactions
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check map-tools.js
          node --check map-layers.js
          node --check facility-details.js
          node --check registry-directory.js
          node --check overview.js
          node --check country-boundary.js
          node --check helplines.js
          node --check statistics.js
          node --check statistics-charts.js
          node --check accessibility.js
          node --check analysis.js
          node --check charts.js
          python3 scripts/build_statistics.py --check
          python3 scripts/validate_dghs.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/shastho-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 0.2
          done
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/smoke.cjs
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/directory.cjs
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/helplines.cjs
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/statistics.cjs
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/accessibility.cjs
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/analysis.cjs
          NODE_PATH="$RUNNER_TEMP/shastho-tests/node_modules" node tests/atlas.cjs
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp atlas.html atlas.css choropleth.js map-layers.js i18n.js names-bn.js statistics-charts.js charts.js charts.css analysis.html analysis.js analysis.css accessibility.html accessibility.js accessibility.css statistics.html statistics.js statistics.css index.html overview.html helplines.html app.js overview.js helplines.js country-boundary.js map-tools.js facility-details.js registry-directory.js styles.css favicon.png apple-touch-icon.png logo.png _site/
          cp -r vendor _site/vendor
          cp -r data _site/data
          touch _site/.nojekyll
          python3 scripts/version_assets.py --directory _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
